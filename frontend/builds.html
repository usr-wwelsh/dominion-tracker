<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dominion Tracker - Create Build</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <meta name="theme-color" content="#181f30">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/builds.css">
  <script>if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js');</script>
</head>
<body>
  <header class="site-header">
    <a href="index.html" class="site-brand">
      <img class="brand-icon" src="/icon-192.png" alt="">
      <span class="brand-name">Dominion Tracker</span>
    </a>
    <button class="nav-toggle" id="nav-toggle" aria-label="Menu" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
    <nav id="main-nav">
      <ul>
        <li><a href="scoreboard.html">Play Game</a></li>
        <li><a href="live.html">Live</a></li>
        <li><a href="players.html">Players</a></li>
        <li class="nav-dropdown active">
          <button type="button" class="nav-dropdown-toggle">Builds &#9662;</button>
          <ul class="nav-dropdown-menu">
            <li><a href="builds.html" class="active">Create Build</a></li>
            <li><a href="view-builds.html">View Builds</a></li>
          </ul>
        </li>
        <li class="nav-dropdown">
          <button type="button" class="nav-dropdown-toggle">Standings &#9662;</button>
          <ul class="nav-dropdown-menu">
            <li><a href="leaderboard.html">Leaderboard</a></li>
            <li><a href="games.html">Recent Games</a></li>
            <li><a href="history.html">History</a></li>
          </ul>
        </li>
        <li><a href="tournament.html">Tournament</a></li>
      </ul>
    </nav>
  </header>

  <div class="container">
    <div class="page-banner"><h1>Create Build</h1></div>

    <div id="error-message" class="error" style="display: none;"></div>
    <div id="success-message" class="success" style="display: none;"></div>

    <!-- Create Build Wizard -->
    <div class="card">
      <div class="card-header">Create New Build</div>

      <div class="cb-stepper" id="cb-stepper">
        <span class="cb-step-dot" data-step="expansions">1<em>Expansions</em></span>
        <span class="cb-step-dot" data-step="cards">2<em>Cards</em></span>
        <span class="cb-step-dot" data-step="extras">3<em>Extras</em></span>
        <span class="cb-step-dot" data-step="name">4<em>Name</em></span>
      </div>

      <form id="create-build-form">
        <!-- Step 1: Expansions -->
        <section class="cb-panel" id="cb-panel-expansions">
          <label>Which expansions are in play? *</label>
          <div class="expansion-grid" id="cb-expansion-grid"></div>
          <div class="cb-actions">
            <span class="cb-hint" id="cb-expansions-hint"></span>
            <button type="button" class="btn btn-primary cb-next" data-step="expansions">Next</button>
          </div>
        </section>

        <!-- Step 2: Cards -->
        <section class="cb-panel" id="cb-panel-cards" hidden>
          <div id="card-count" class="card-count">0 / 10 kingdom cards selected</div>
          <div class="expansion-sections" id="cb-card-sections"></div>
          <div class="cb-actions">
            <button type="button" class="btn cb-back" data-step="cards">Back</button>
            <button type="button" class="btn btn-primary cb-next" data-step="cards">Next</button>
          </div>
        </section>

        <!-- Step 3: Extras (auto-detected from chosen expansions) -->
        <section class="cb-panel" id="cb-panel-extras" hidden>
          <div class="cb-options-list" id="cb-options-list"></div>
          <div class="expansion-sections" id="cb-supplemental-sections"></div>
          <div class="cb-actions">
            <button type="button" class="btn cb-back" data-step="extras">Back</button>
            <button type="button" class="btn btn-primary cb-next" data-step="extras">Next</button>
          </div>
        </section>

        <!-- Step 4: Name & Details -->
        <section class="cb-panel" id="cb-panel-name" hidden>
          <div class="form-group">
            <label for="build-nickname">Build Nickname *</label>
            <input
              type="text"
              id="build-nickname"
              name="nickname"
              placeholder="e.g., Village Engine, Big Money, Chapel Rush"
              required
            >
          </div>

          <div class="form-group">
            <label for="build-notes">Notes (optional)</label>
            <textarea id="build-notes" rows="3" placeholder="Strategy notes, combos to watch for, etc."></textarea>
          </div>

          <div class="form-group">
            <label>Build Type</label>
            <div class="segmented-control" id="build-type-control">
              <button type="button" class="segmented-option active" data-type="custom">Custom</button>
              <button type="button" class="segmented-option" data-type="suggested">Suggested</button>
              <button type="button" class="segmented-option" data-type="experimental">Experimental</button>
            </div>
          </div>

          <div class="cb-summary" id="cb-summary"></div>

          <div class="cb-actions">
            <button type="button" class="btn cb-back" data-step="name">Back</button>
            <button type="submit" class="btn btn-primary">Create Build</button>
            <button type="button" class="btn" id="clear-form">Clear Form</button>
          </div>
        </section>
      </form>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/header.js"></script>
  <script src="js/dominion-cards.js"></script>
  <script src="js/create-build.js"></script>
  <script src="js/falling-cards.js"></script>
</body>
</html>
