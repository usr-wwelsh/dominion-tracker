name: CI

# Lint + tests. Runs on its own for pull requests, and is called by the deploy
# workflow so a failing check blocks the image push rather than shipping.

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install lint tooling
        run: npm ci

      - name: Install backend dependencies
        run: npm --prefix backend ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test
