name: Build and Push

# Publishes the image to the registry. Deployment is pull-based: Watchtower on
# the host polls for the new :latest and redeploys itself, so a push never
# depends on the host being reachable. Server-side config changes (compose,
# first-time Watchtower bootstrap) go through the manual server-sync workflow.

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "backend/**"
      - "frontend/**"
      - "docker-compose.yml"
      - ".github/workflows/deploy.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: wwelsh/dominion-tracker
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          load: true

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: wwelsh/dominion-tracker:latest
          format: table
          exit-code: 1
          severity: CRITICAL
          # Only fail on vulns that have a fix we can actually apply; base-image
          # OS CVEs the distro has deferred/won't-fix would block deploys forever.
          ignore-unfixed: true

      - name: Push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
