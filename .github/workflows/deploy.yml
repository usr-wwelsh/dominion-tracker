name: Build and Push

# Publishes the image to the registry. Deployment is pull-based: Watchtower on
# the host polls for the new :latest and redeploys itself, so a push never
# depends on the host being reachable. Server-side config changes (compose,
# first-time Watchtower bootstrap) go through the manual server-sync workflow.

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "backend/**"
      - "frontend/**"
      - "docker-compose.yml"
      - ".github/workflows/deploy.yml"

permissions:
  contents: write

jobs:
  # Lint + tests must pass before anything is built or pushed.
  checks:
    uses: ./.github/workflows/ci.yml

  build:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Sync card art lists
        run: node backend/scripts/sync-card-art.js

      - name: Commit regenerated card lists
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        run: |
          if ! git diff --quiet -- frontend/js/cards.js frontend/js/falling-cards.js; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add frontend/js/cards.js frontend/js/falling-cards.js
            git commit -m "chore: sync card art lists [skip ci]"
            git push
          fi

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: wwelsh/dominion-tracker
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          load: true

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: wwelsh/dominion-tracker:latest
          format: table
          exit-code: 1
          severity: CRITICAL
          # Only fail on vulns that have a fix we can actually apply; base-image
          # OS CVEs the distro has deferred/won't-fix would block deploys forever.
          ignore-unfixed: true

      - name: Push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
